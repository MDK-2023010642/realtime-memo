<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncNote - 限定公開共有メモ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
        textarea:focus, input:focus { outline: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- アクセス制限画面（URLを知らない人向けのロック画面） -->
    <div id="lock-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-5 border border-indigo-500/20">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">このページは限定公開です</h2>
            <p class="text-sm text-slate-400 mb-6 leading-relaxed">
                専用の共有URL（アクセスキー付きリンク）を知っている方のみ閲覧・編集が可能です。共有されたリンクから再度アクセスしてください。
            </p>
            <div class="border-t border-slate-800 pt-5">
                <button onclick="createNewSecretNote()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-indigo-500/20">
                    新しい専用共有リンクを発行して始める
                </button>
            </div>
        </div>
    </div>

    <!-- メインアプリ画面（有効なURLハッシュがある場合のみ表示） -->
    <div id="app-container" class="hidden flex-1 flex flex-col">
        <!-- ヘッダー -->
        <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow">S</div>
                <h1 class="text-lg font-bold text-white tracking-tight">SyncNote</h1>
                <span id="status-badge" class="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">同期準備完了</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="copyShareLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    <span>共有リンクをコピー</span>
                </button>
            </div>
        </header>

        <!-- エディタ領域 -->
        <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
            <div class="bg-slate-800/60 rounded-xl shadow-lg border border-slate-700/70 flex-1 flex flex-col overflow-hidden">
                <div class="px-4 py-2.5 border-b border-slate-700/70 flex items-center justify-between bg-slate-800/80 text-xs text-slate-400">
                    <span>🔒 このURLを知っている人のみ閲覧・編集できます</span>
                    <span id="char-count">0文字</span>
                </div>
                <textarea id="memo-content" class="flex-1 p-5 bg-transparent resize-none text-slate-100 placeholder-slate-500 text-base leading-relaxed" placeholder="ここにメモを入力してください。入力内容は自動的にURLに暗号化保存されます..."></textarea>
            </div>
        </main>
    </div>

    <script>
        const lockScreen = document.getElementById('lock-screen');
        const appContainer = document.getElementById('app-container');
        const textarea = document.getElementById('memo-content');
        const charCount = document.getElementById('char-count');
        const statusBadge = document.getElementById('status-badge');

        // 識別プレフィックス（これがないURLは不正アクセスとしてブロック）
        const SECRET_PREFIX = 'sn_';

        // 文字列のエンコード・デコード
        function encodeData(str) {
            return SECRET_PREFIX + btoa(unescape(encodeURIComponent(str)));
        }

        function decodeData(hashStr) {
            if (!hashStr.startsWith(SECRET_PREFIX)) return null;
            const raw = hashStr.slice(SECRET_PREFIX.length);
            try {
                return decodeURIComponent(escape(atob(raw)));
            } catch (e) {
                return null;
            }
        }

        // 初期化とURLチェック
        function checkAccess() {
            const hash = window.location.hash.substring(1);
            const decodedText = decodeData(hash);

            if (decodedText !== null) {
                // 正しい共有URLの場合のみロック解除
                lockScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
                textarea.value = decodedText;
                updateCharCount();
            } else {
                // URLハッシュがない、または不正な場合はロック画面を表示
                lockScreen.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        }

        // 新規専用リンク発行
        function createNewSecretNote() {
            const initialHash = encodeData('');
            history.replaceState(null, null, '#' + initialHash);
            checkAccess();
            textarea.focus();
        }

        window.addEventListener('DOMContentLoaded', checkAccess);
        window.addEventListener('hashchange', checkAccess);

        // 入力時にURLをリアルタイム更新
        let saveTimer = null;
        textarea.addEventListener('input', () => {
            updateCharCount();
            statusBadge.textContent = 'URL更新中...';
            statusBadge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium';

            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                const encoded = encodeData(textarea.value);
                history.replaceState(null, null, '#' + encoded);
                statusBadge.textContent = 'URL保存完了';
                statusBadge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium';
            }, 300);
        });

        function updateCharCount() {
            charCount.textContent = textarea.value.length + '文字';
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('専用共有リンクをコピーしました！\n※このURLを知っている人だけがメモを開けます。');
            });
        }
    </script>
</body>
</html>
